name: Test
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -q
      - run: swiftc -typecheck -framework AppKit -framework SwiftUI BCUStatus.swift
